<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ganpat University - Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /* =========================================
           GLOBAL STYLES
           ========================================= */
        body {
            height: 100vh;
            background: url("images/Campus.jpg") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .title {
            text-align: center;
            color: black;
            text-shadow: 2px 1px white;
            position: absolute;
            top: 30px;
            width: 100%;
            letter-spacing: 4px;
            font-weight: 700;
            z-index: 2;
        }

        /* =========================================
           FLOATING BADGES & FOOTER
           ========================================= */
        .floating-badge {
            position: absolute;
            z-index: 2;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }
        

        .badge-qs { top: 30%; left: 15%; width: 180px; }
        .badge-naac-left { top: 55%; left: 16%; width: 140px; }
        .badge-gsirf { top: 32%; right: 15%; width: 200px; }
        .badge-careedge { top: 52%; right: 15%; width: 200px; }
        .badge-coe { bottom: 60px; left: 50%; transform: translateX(-50%); width: 350px; }

        .login-footer {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: #2b353e;
            color: #ccc;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            z-index: 3;
        }

        @media (max-width: 1024px) {
            .floating-badge { display: none; }
        }

        /* =========================================
           AUTH BOX SHARED STYLES
           ========================================= */
        .auth-box {
            position: relative;
            z-index: 2;
            background: rgba(0, 51, 66, 0.85);
            padding: 30px 30px 25px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 40px;
        }

        #login-container { width: 380px; }
        #signup-container { width: 500px; display: none; } /* Hidden by default */

        .auth-box img.logo {
            width: 120px;
            display: block;
            margin: -60px auto 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .auth-box h5 { text-align: center; font-weight: 600; margin-bottom: 20px; }

        /* =========================================
           FORM CONTROLS
           ========================================= */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 1px solid transparent;
            font-size: 14px;
            height: 40px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 10px rgba(30, 136, 229, 0.6);
            border-color: #1e88e5;
        }

        .input-box { margin-bottom: 15px; }
        .input-box label { font-size: 13px; margin-bottom: 5px; font-weight: 500; }

        .field-wrapper { position: relative; width: 100%; }
        .field-wrapper .form-control { padding-right: 40px; }
        .field-wrapper i {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px; color: #555;
        }
        
        .toggle-password { pointer-events: auto; cursor: pointer; }
        .toggle-password:hover { color: #1e88e5; }

        /* Buttons & Links */
        .btn-theme {
            background: #1e88e5; border: none; width: 100%; color: white;
            font-weight: 600; padding: 10px; border-radius: 6px; transition: 0.3s;
        }
        .btn-theme:hover { background: #1565c0; transform: translateY(-2px); }

        .form-link { font-size: 13px; color: #90caf9; text-decoration: none; transition: 0.3s; }
        .form-link:hover { color: #fff; text-decoration: underline; }
        
        .switch-form { text-align: center; display: block; margin-top: 15px; }

        /* Specific fix for signup spacing */
        #signup-container .input-box { margin-bottom: 10px; }
        #signup-container .form-control, #signup-container .form-select { height: 36px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <h3 class="title">GANPAT UNIVERSITY</h3>

    <img src="images/QS.png" class="floating-badge badge-qs" alt="QS I-Gauge Diamond">
    <img src="images/NAAC.png" class="floating-badge badge-naac-left" alt="NAAC A Grade">
    <img src="images/GSIRF.png" class="floating-badge badge-gsirf" alt="GSIRF 5 Stars">
    <img src="images/Care Edge.png" class="floating-badge badge-careedge" alt="Care Edge Grading">
    <img src="images/Gnu_Coe.png" class="floating-badge badge-coe" alt="Centre of Excellence">

    <div id="login-container" class="auth-box">
        <img src="images/GUNI.jpg" alt="GUNI Logo" class="logo">
        <h5>Student Login</h5>

        <form id="loginForm">
            <div class="input-box">
                <label>Username or Email</label>
                <div class="field-wrapper">
                    <input type="text" id="loginUser" class="form-control" placeholder="Enter ID or Email" required>
                    <i class='bx bx-user'></i>
                </div>
            </div>

            <div class="input-box">
                <div class="d-flex justify-content-between">
                    <label>Password</label>
                    <a href="#" class="form-link" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot password?</a>
                </div>
                <div class="field-wrapper">
                    <input type="password" id="loginPass" class="form-control" placeholder="Enter Password" required>
                    <i class='bx bx-show toggle-password'></i>
                </div>
            </div>

            <button type="submit" class="btn btn-theme mt-2">Log In</button>
            <a href="#" class="form-link switch-form" id="go-to-signup">Don't have an account? Sign Up</a>
        </form>
    </div>

    <div id="signup-container" class="auth-box">
        <img src="images/GUNI.jpg" alt="GUNI Logo" class="logo" style="width: 90px; margin-top: -50px;">
        <h5>Student Registration</h5>

        <form id="signupForm">
            <div class="input-box">
                <label>Full Name</label>
                <div class="field-wrapper">
                    <input type="text" id="regName" class="form-control" placeholder="Enter Full Name" required>
                    <i class='bx bx-user'></i>
                </div>
            </div>

            <div class="row">
                <div class="col-6 input-box">
                    <label>Enrollment Number</label>
                    <input type="number" id="regEnrollment" class="form-control" placeholder="e.g. 2503..." required>
                </div>
                <div class="col-6 input-box">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="Enter Email" required>
                </div>
            </div>

            <div class="row">
                <div class="col-6 input-box">
                    <label>Phone Number</label>
                    <div class="field-wrapper">
                        <input type="tel" id="regPhone" class="form-control" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
                        <i class='bx bx-phone'></i>
                    </div>
                </div>
                <div class="col-6 input-box">
                    <label>Gender</label>
                    <select id="regGender" class="form-select" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-6 input-box">
                    <label>Institute</label>
                    <select id="regInstitute" class="form-select" required>
                        <option value="" disabled selected>Select Institute</option>
                        <option value="UVPCE">UVPCE (Engineering)</option>
                        <option value="AMPICS">AMPICS (Computer Studies)</option>
                        <option value="VMPIM">VMPIM (Management)</option>
                        <option value="MUIS">MUIS (Sciences)</option>
                    </select>
                </div>
                <div class="col-6 input-box">
                    <label>Course</label>
                    <select id="regCourse" class="form-select" required disabled>
                        <option value="" disabled selected>Select Course</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-6 input-box">
                    <label>Password</label>
                    <div class="field-wrapper">
                        <input type="password" id="regPass" class="form-control" placeholder="Password" required>
                        <i class='bx bx-show toggle-password'></i>
                    </div>
                </div>
                <div class="col-6 input-box">
                    <label>Confirm Password</label>
                    <div class="field-wrapper">
                        <input type="password" id="regConfirm" class="form-control" placeholder="Confirm" required>
                        <i class='bx bx-show toggle-password'></i>
                    </div>
                </div>
            </div>

            <div class="form-check mb-2 mt-1">
                <input class="form-check-input" type="checkbox" id="rulesCheckbox" required>
                <label class="form-check-label" for="rulesCheckbox" style="font-size: 12px;">
                    I agree to the <a href="#" class="form-link" style="display:inline;">Rules & Regulations</a>
                </label>
            </div>

            <button type="submit" class="btn btn-theme mt-1">Create Account</button>
            <a href="#" class="form-link switch-form" id="go-to-login">Already have an account? Log In</a>
        </form>
    </div>

    <div class="login-footer">
        &copy; K & K Pvt. Ltd. | Ganpat University
    </div>

    <div class="modal fade" id="forgotModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header">
                    <h5 class="modal-title">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Enter your registered email address to receive a password reset link.</p>
                    <input type="email" class="form-control" placeholder="Registered Email Address">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-theme">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    $(document).ready(function() {
        
        // ==========================================
        // YOUR GOOGLE SCRIPT URL
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtFnMF0IAXhdBmKdE_1WYJrfVPomMpyDHGXGL3C_gZVsNXm6driIrDp7UMBwLtmkVD/exec"; 

        // --- DYNAMIC TEXT REPLACEMENT ---
        $("#loginUser").attr("placeholder", "Enter E.No.").parent().prev("label").text("E.No.");

        // --- 1. TOGGLE BETWEEN LOGIN AND SIGNUP ---
        $("#go-to-signup, #forgot-password-link").click(function(e) {
            e.preventDefault();
            $("#login-container").fadeOut(250, function() {
                $("#signup-container").fadeIn(250);
            });
        });

        $("#go-to-login, a[data-bs-target='#forgotModal']").removeAttr("data-bs-toggle").removeAttr("data-bs-target").click(function(e) {
            e.preventDefault();
            $("#signup-container").fadeOut(250, function() {
                $("#login-container").fadeIn(250);
            });
        });

        // --- 2. SHOW/HIDE PASSWORD LOGIC ---
        $(".toggle-password").click(function() {
            $(this).toggleClass("bx-show bx-hide");
            let input = $(this).siblings("input");
            if (input.attr("type") === "password") {
                input.attr("type", "text");
            } else {
                input.attr("type", "password");
            }
        });

        // --- 3. CASCADING DROPDOWN LOGIC ---
        const instituteCourses = {
            "UVPCE": ["B.Tech Computer Engineering", "B.Tech IT", "B.Tech Mechanical", "M.Tech Civil"],
            "AMPICS": ["BCA", "BCA HONS.", "MCA", "BCA AI ML", "BCA CYBER SECURITY"],
            "VMPIM": ["BBA", "MBA", "Ph.D Management"],
            "MUIS": ["B.Sc. Mathematics", "B.Sc. Chemistry", "M.Sc. Physics"]
        };

        $("#regInstitute").change(function() {
            let selectedInstitute = $(this).val();
            let $courseDropdown = $("#regCourse");

            $courseDropdown.empty().append('<option value="" disabled selected>Select Course</option>');

            if (selectedInstitute && instituteCourses[selectedInstitute]) {
                instituteCourses[selectedInstitute].forEach(function(course) {
                    $courseDropdown.append(`<option value="${course}">${course}</option>`);
                });
                $courseDropdown.prop("disabled", false); 
            } else {
                $courseDropdown.prop("disabled", true); 
            }
        });

        // --- 4. SIGNUP FORM SUBMISSION (SEND TO GOOGLE SHEETS) ---
        $("#signupForm").submit(function(e) {
            e.preventDefault();
            
            let btn = $(this).find('button[type="submit"]');
            let originalText = btn.text();
            
            // NOTE: We are NOT using JSON.stringify anymore to avoid CORS errors.
            let dataObj = {
                action: "signup",
                fullName: $("#regName").val(),
                enrollment: $("#regEnrollment").val(),
                email: $("#regEmail").val(),
                phone: $("#regPhone").val(),
                gender: $("#regGender").val(),
                institute: $("#regInstitute").val(),
                course: $("#regCourse").val(),
                password: $("#regPass").val()
            };
            
            let confirmPass = $("#regConfirm").val();
            let termsAgreed = $("#rulesCheckbox").is(":checked");

            // Validations
            if (!termsAgreed) { alert("❌ You must agree to the Rules & Regulations."); return; }
            if (dataObj.enrollment.length < 11) { alert("❌ Please enter a valid 11-digit E.No."); return; }
            if (dataObj.phone.length !== 10) { alert("❌ Please enter a valid 10-digit phone number."); return; }
            if (!dataObj.gender || !dataObj.institute || !dataObj.course) { alert("❌ Please fill out all dropdown selections."); return; }
            if (dataObj.password.length < 5) { alert("❌ Password must be at least 5 characters long."); return; }
            if (dataObj.password !== confirmPass) { alert("❌ Passwords do not match!"); return; }

            // UI Feedback
            btn.prop('disabled', true).text('Registering...');

            // Send to Google Sheets as standard form data
            $.ajax({
                url: SCRIPT_URL,
                type: "POST",
                data: dataObj,
                success: function(response) {
                    let res = typeof response === "string" ? JSON.parse(response) : response;
                    if(res.status === "success") {
                        alert(`✅ ${res.message}\n\nPlease wait for the Admin to type "Approved"`);
                        $("#signupForm")[0].reset();
                        $("#go-to-login").click();
                    } else {
                        alert(`❌ Error: ${res.message}`);
                    }
                },
                error: function() {
                    alert("❌ Connection error. Please try again.");
                },
                complete: function() {
                    btn.prop('disabled', false).text(originalText);
                }
            });
        });

        // --- 5. LOGIN FORM SUBMISSION (CHECK GOOGLE SHEETS) ---
        $("#loginForm").submit(function(e) {
            e.preventDefault();
            
            let loginEno = $("#loginUser").val().trim(); 
            let loginPass = $("#loginPass").val();
            let btn = $(this).find('button[type="submit"]');
            let originalText = btn.text();

            if (loginEno === "" || loginPass === "") {
                alert("❌ Please enter both your E.No. and Password.");
                return;
            }
            
            // Backdoor Admin Logic
            if (loginEno === "admin" && loginPass === "ampics") {
                alert("✅ Admin Login Successful");
                localStorage.setItem("login", "true");
                window.location.href = "sem webpage.html"; 
                return;
            }

            btn.prop('disabled', true).text('Checking...');

            // Append parameters to GET URL
            let loginUrl = `${SCRIPT_URL}?eno=${encodeURIComponent(loginEno)}&password=${encodeURIComponent(loginPass)}`;

            $.get(loginUrl, function(response) {
                let res = typeof response === 'string' ? JSON.parse(response) : response;
                
                if (res.status === "success") {
                    alert(`✅ Welcome back, ${res.name}!\nLogin Successful.`);
                    localStorage.setItem("login", "true");
                    window.location.href = "sem webpage.html"; 
                } else {
                    alert(`❌ ${res.message}`); 
                }
            }).fail(function() {
                alert("❌ Database connection error. Try again.");
            }).always(function() {
                btn.prop('disabled', false).text(originalText);
            });
        });

    });
    </script>
</body>
</html>
