<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#ff7eb3,#7afcff,#7b2ff7);
    background-size:300% 300%;
    animation:bgMove 10s ease infinite;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border-radius:16px;
    padding:40px;
    width:90%;
    max-width:520px;
    text-align:center;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:10px;
    letter-spacing:1px;
}

h2{
    margin-bottom:20px;
    font-weight:400;
}

h4{
    margin:8px 0;
    transition:0.3s;
}

h4:hover{
    transform:translateX(5px);
    color:#ffe082;
}

button{
    margin-top:20px;
    padding:9px 30px;
    border:none;
    border-radius:30px;
    background: linear-gradient(45deg,#ff512f,#dd2476);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}



/* Link reset */
.material-link{
  text-decoration:none;
}

/* Button style */
.open-btn{
  padding:14px 28px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background: linear-gradient(45deg,#ff6f4b,#4b0401);
  color:white;
  cursor:pointer;
  transition: all 0.3s ease;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* Hover effect */
.open-btn:hover{
  transform: translateY(-3px) scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* Click effect */
.open-btn:active{
  transform: scale(0.95);
}

</style>
</head>
