<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Screen PDF Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Remove scroll completely */
html, body{
  height:100%;
  margin:0;
  overflow:hidden;
}

/* Fixed navbar height */
.navbar{
  height:60px;
  background: linear-gradient(90deg,#ff512f,#dd2476);
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
}

/* Full screen PDF area */
.pdf-container{
  height: calc(100vh - 60px);
}

/* PDF fills screen */
.pdf-container iframe{
  width:100%;
  height:100%;
  border:none;
}

/* Next topic button card */
.unit-card{
  background:white;
  border-radius:10px;
  padding:8px 15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  transition:0.3s;
}

.unit-card:hover{
  transform:scale(1.05);
}

.unit-link{
  text-decoration:none;
  color:#333;
  font-weight:600;
}

</style>
</head>

<body>

<nav class="navbar navbar-dark px-3">
  <a href="Unit 1 Full Material 3.html" class="unit-link">
    <div class="unit-card">📘 Next Topic</div>
  </a>
</nav>

<div class="pdf-container">
  <iframe src="TYPES OF SENTENCES_EWS_SEM-II.pdf"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
